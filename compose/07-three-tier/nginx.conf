# Provided: mount this file into the proxy container at /etc/nginx/conf.d/default.conf
server {
    listen 80;
    server_name _;

    # Static frontend (mount ./frontend to /usr/share/nginx/html)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Everything under /api/ is forwarded to the API service. "api" is a compose
    # service name, resolved by Docker's built-in DNS.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
